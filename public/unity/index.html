<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#bfe6c8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='20' fill='%23f2665c'/%3E%3Cpath d='M32 18c-6-10-16-8-18-4 8 0 14 3 18 4zm0 0c6-10 16-8 18-4-8 0-14 3-18 4z' fill='%237bc96f'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
    <title>Bloomkeeper</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6c8; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #bfe6c8; }
      /* the web game's #boot screen */
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 40%, #fffaf0, #f5e6c4); transition: opacity .5s cubic-bezier(.25,.8,.3,1);
        font-family: Fredoka, ui-rounded, system-ui, sans-serif; }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-sprout { width: 64px; height: 64px; position: relative; }
      .boot-sprout::before, .boot-sprout::after { content: ''; position: absolute; bottom: 18px; width: 26px; height: 18px; background: #7bc96f;
        border-radius: 100% 0 100% 0; animation: sprout 1.2s cubic-bezier(.25,.8,.3,1) infinite alternate; }
      .boot-sprout::before { left: 7px; transform-origin: 100% 100%; }
      .boot-sprout::after { right: 7px; border-radius: 0 100% 0 100%; transform-origin: 0 100%; animation-delay: .15s; }
      .boot-label { font-weight: 600; color: #8d6c55; font-size: 15px; }
      .boot-bar { width: 140px; height: 8px; border-radius: 99px; background: #ecdcb8; overflow: hidden; }
      .boot-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: #7bc96f; transition: width .2s; }
      .boot-err { max-width: 280px; text-align: center; color: #b04a3c; font-size: 14px; display: none; }
      @keyframes sprout { from { transform: scale(.6) rotate(-8deg); } to { transform: scale(1.05) rotate(6deg); } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="boot">
      <div class="boot-sprout"></div>
      <div class="boot-label">Waking up the garden…</div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <div class="boot-err" id="boot-err"></div>
    </div>
    <script>
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/98cd15cc7ad1f24fad59b82c7aa34c9d.data.unityweb",
        frameworkUrl: buildUrl + "/1d6f62d15b3ebd18ee381e17daf906f6.framework.js.unityweb",
        codeUrl: buildUrl + "/3d2a736abbc2dfa544da0f74d8339db5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Bloomkeeper",
        productName: "Bloomkeeper",
        productVersion: "1.0.0",
        // crisp but affordable: the web game caps its renderer at 2× too
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === 'error') fail(msg); else console.warn(msg); },
      };
      function fail(msg) {
        var e = document.getElementById("boot-err");
        e.textContent = "The garden couldn't wake up: " + msg;
        e.style.display = "block";
      }
      var canvas = document.getElementById("unity-canvas");
      var script = document.createElement("script");
      script.src = buildUrl + "/a4867b85992aee1f879625bf8f72f284.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.getElementById("boot-fill").style.width = Math.round(p * 100) + "%";
        }).then(function () {
          // let the first frames paint behind the cover, then fade it like the web boot
          setTimeout(function () { document.getElementById("boot").classList.add("done"); }, 350);
        }).catch(function (m) { fail(m); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
